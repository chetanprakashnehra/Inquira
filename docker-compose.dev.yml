version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inquira-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inquira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquira_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inquira_db}
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inquira_user} -d ${POSTGRES_DB:-inquira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inquira-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: inquira-dev-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inquira-dev-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-inquira_user}:${POSTGRES_PASSWORD:-inquira_pass}@postgres:5432/${POSTGRES_DB:-inquira_db}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretjwtkeychangeinproduction12345}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_qdrant_data:
