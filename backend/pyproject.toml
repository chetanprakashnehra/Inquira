[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inquira-backend"
version = "0.1.0"
description = "Inquira - Production Agentic RAG Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "qdrant-client>=1.9.1",
    "langchain>=0.2.5",
    "langgraph>=0.1.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
